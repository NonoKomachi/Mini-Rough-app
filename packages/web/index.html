<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ミニラフ小町</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #2b2b2b;
        color: #eee;
        font-family: sans-serif;
        overflow: hidden;
        --layer-drawer-handle-h: 28px;
      }
      button {
        font-family: inherit;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      /* ---- スマホ縦持ち専用の2種類の「ドロワー」----
         通常(PC/横長)は#mobile-nav-drawer/#mobile-viewbar-drawerを#appの他の子と同じ
         縦積みのflexアイテムにして、中の#menu-bar/#variant-view-barをそのまま縦に並べる。
         縦長レイアウト時だけ、それぞれ以下の形に変身する:
           #mobile-nav-drawer(メニューバー=ファイル/編集/選択範囲/ヘルプ/設定)は
             左からスライドするposition:fixedのオーバーレイ(キャンバスに被る、背景タップで閉じる)。
             開閉位置はCSSのtransition+transformではなくJS側でleft(px)を直接書き換えて制御する —
             #layer-panelのボトムシート(下記「レイヤーパネルのボトムシート化」参照)と同じ理由で、
             position:fixed要素のtransformがこの環境では反映されないことがある(アニメーションより
             「必ず正しい位置に開閉する」ことを優先する)。
           #mobile-viewbar-drawer(バリエーション操作/倍率/表示サイズ切替/背景色)は
             オーバーレイにはせず、通常のフロー内でツールバーを押し下げて現れる
             (display:none⇄flexの切替のみ、position:fixedではないのでtransformの問題はない)。 */
      #mobile-nav-drawer,
      #mobile-viewbar-drawer {
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
      }
      #mobile-nav-backdrop {
        display: none;
      }
      /* .toolbar-icon-btn(display:flex)より後方で定義されるため、同じクラス詳細度では
         ソース順で負けて常時表示になってしまう — idセレクタにして確実に上書きする。 */
      #mobile-nav-toggle {
        display: none;
      }
      body.portrait-layout #mobile-nav-toggle {
        display: flex;
      }
      /* 表示バードロワーの開閉トリガーは、#layer-panel-handleと同じ「全幅の横長ハンドルバー」
         (小さな正方形ボタンではなく)にする — 見た目をレイヤーパネルのつまみと揃える。 */
      #mobile-viewbar-handle {
        display: none;
      }
      body.portrait-layout #mobile-viewbar-handle {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        height: 34px;
        background: #2a2a2a;
        border-bottom: 1px solid #444;
        color: #ccc;
        font-size: 16px;
        cursor: pointer;
      }
      /* 左から出るナビゲーションドロワー(メニューバー)。 */
      body.portrait-layout #mobile-nav-drawer {
        display: flex;
        flex-direction: column;
        position: fixed;
        top: 0;
        bottom: 0;
        width: min(78vw, 260px);
        z-index: 260;
        background: #1a1a1a;
        overflow-y: auto;
        box-shadow: 4px 0 14px rgba(0, 0, 0, 0.5);
      }
      /* ドロワー内では横一列ではなく縦リストにする(左ナビとしての一般的な見た目)。 */
      body.portrait-layout #mobile-nav-drawer #menu-bar {
        flex-direction: column;
        border-bottom: none;
      }
      body.portrait-layout #mobile-nav-drawer #menu-bar button {
        text-align: left;
        padding: 14px 18px;
        font-size: 14px;
        border-bottom: 1px solid #333;
      }
      /* アコーディオンの見出し(ファイル/編集/選択範囲/ヘルプ) — 開閉状態を示す矢印を右端に出す。
       * .nav-accordion-trigger自体はデスクトップのプルダウン用ボタンにも付くクラスだが、
       * 矢印はこのドロワー内(縦リスト表示時)でのみ表示する。 */
      body.portrait-layout #mobile-nav-drawer #menu-bar button.nav-accordion-trigger {
        position: relative;
      }
      body.portrait-layout #mobile-nav-drawer #menu-bar button.nav-accordion-trigger::after {
        content: "▸";
        position: absolute;
        right: 18px;
        top: 50%;
        transform: translateY(-50%);
        color: #888;
        font-size: 12px;
      }
      body.portrait-layout #mobile-nav-drawer #menu-bar button.nav-accordion-trigger.open::after {
        content: "▾";
      }
      /* アコーディオンの中身 — 既定では折りたたまれていて、.openが付いた時だけ縦に展開する
       * (プルダウン用の.dropdown-menu/.dropdown-itemとは別の、ドロワー内だけの見た目)。 */
      .nav-accordion-panel {
        display: none;
      }
      body.portrait-layout #mobile-nav-drawer .nav-accordion-panel.open {
        display: flex;
        flex-direction: column;
        background: #141414;
      }
      /* #menu-bar buttonの詳細度(id2個)に対抗するため、こちらも#menu-barを明示して
       * id数を揃える(.nav-accordion-panel/.dropdown-itemのクラス数だけでは勝てない)。 */
      body.portrait-layout #mobile-nav-drawer #menu-bar .nav-accordion-panel .dropdown-item {
        padding-left: 52px;
        border-bottom: 1px solid #292929;
      }
      body.portrait-layout #mobile-nav-backdrop.open {
        display: block;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        z-index: 255;
      }
      /* バリエーション操作/倍率/表示サイズ切替/背景色 — キャンバスやツールバーに被せる
         オーバーレイではなく、ハンドルバーをタップすると通常のフロー内で高さを持って現れ、
         ツールバー(その下に続く要素)を押し下げる形にする(閉じている間はdisplay:noneで
         高さ0、何も覆わない)。DOM上ではツールバーより前にあるので、開くと見た目として
         「ツールの上」に現れる。 */
      body.portrait-layout #mobile-viewbar-drawer {
        display: none;
      }
      body.portrait-layout #mobile-viewbar-drawer.open {
        display: flex;
        flex-direction: column;
        max-height: 60vh;
        overflow-y: auto;
        border-bottom: 1px solid #444;
      }

      /* ---- Menu bar (top-most) ---- */
      #menu-bar {
        flex-shrink: 0;
        display: flex;
        background: #1a1a1a;
        border-bottom: 1px solid #444;
      }
      #menu-bar button {
        padding: 6px 16px;
        background: transparent;
        border: none;
        color: #eee;
        cursor: pointer;
        font-size: 13px;
      }
      #menu-bar button:hover,
      #menu-bar button.open {
        background: #3a3a3a;
      }

      /* ---- Pulldown menu panel (shared by all menu-bar buttons) ---- */
      .dropdown-menu {
        display: none;
        position: fixed;
        background: #2a2a2a;
        border: 1px solid #555;
        border-radius: 0 0 4px 4px;
        min-width: 180px;
        box-shadow: 2px 4px 10px rgba(0, 0, 0, 0.5);
        z-index: 300;
        padding: 4px 0;
      }
      .dropdown-menu.open {
        display: block;
      }
      .dropdown-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        width: 100%;
        box-sizing: border-box;
        text-align: left;
        padding: 7px 16px;
        background: transparent;
        border: none;
        color: #eee;
        cursor: pointer;
        font-size: 13px;
      }
      .dropdown-item:hover {
        background: #3a6ad4;
      }
      .dropdown-item-hint {
        color: #999;
        font-size: 11px;
      }

      /* ---- Variant / view bar (persistent row: below menu bar, above tools) ---- */
      #variant-view-bar {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 8px;
        background: #202020;
        border-bottom: 1px solid #444;
        flex-wrap: wrap;
      }
      /* 役割のまとまり(操作ボタン/倍率スライダー/自動倍率調節/ミニラフ・完成サイズ切替/背景色)
         ごとに折り返し単位をまとめる。狙い: 幅が十分なら1行([操作][倍率][自動調節][サイズ切替]
         ...余白...[背景色]右端)。幅が足りない時はupdateViewBarLayout()がlayout-2line/
         layout-3lineクラスを付け、下記のorder/flex-basisで行の構成を切り替える。
           2行: 1行目=操作+サイズ切替+背景色 / 2行目=倍率スライダー+自動倍率調節
           3行: 1行目=操作+背景色 / 2行目=サイズ切替+倍率スライダー / 3行目=自動倍率調節 */
      .view-bar-group {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
        /* nowrap必須: wrapだと内部要素が先に複数行化してしまい、scrollWidthが「1行に必要な
           本来の幅」ではなく「折り返された状態での最大行幅」になり、updateViewBarLayout()の
           幅判定が不正確になる。極端に狭い画面(スマホ縦長)ではこのグループ自体が横に溢れうる
           が、その場合はその行全体が横スクロール対象になる(#variant-view-barは折り返し可)。 */
        flex-wrap: nowrap;
      }
      /* 既定(1行に収まる場合)の並び順: 操作 → 倍率スライダー → 自動倍率調節 → サイズ切替 → 背景色 */
      .view-bar-actions-group {
        order: 1;
      }
      .view-bar-zoom-group {
        order: 2;
      }
      .view-bar-zoom-auto-group {
        order: 3;
      }
      .size-mode-group.view-bar-group {
        order: 4;
      }
      .view-bar-bg-group {
        order: 5;
        margin-left: auto;
      }
      /* 行の折り返し位置を指定する幅0のスペーサー。グループ自体にflex-basis:100%を付けると
         そのグループが行の全幅を占有し、同じ行に並べたい後続グループが次の行に押し出されて
         しまうため、代わりにこのスペーサーだけをflex-basis:100%にして改行させる(後続の
         グループは通常のflex-basisのまま、新しい行の中で詰めて並ぶ)。 */
      .view-bar-linebreak {
        flex-basis: 0;
        width: 0;
        height: 0;
        min-width: 0;
        padding: 0;
        margin: 0;
        border: 0;
        overflow: hidden;
        order: 99;
      }
      /* 2行: 1行目=操作+サイズ切替+背景色 / 2行目=倍率スライダー+自動倍率調節 */
      .layout-2line .view-bar-actions-group {
        order: 1;
      }
      .layout-2line .size-mode-group.view-bar-group {
        order: 2;
      }
      .layout-2line .view-bar-bg-group {
        order: 3;
        margin-left: auto;
      }
      .layout-2line .view-bar-linebreak-a {
        order: 4;
        flex-basis: 100%;
      }
      .layout-2line .view-bar-zoom-group {
        order: 5;
      }
      .layout-2line .view-bar-zoom-auto-group {
        order: 6;
      }
      /* 3行: 1行目=操作+背景色 / 2行目=サイズ切替+倍率スライダー / 3行目=自動倍率調節 */
      .layout-3line .view-bar-actions-group {
        order: 1;
      }
      .layout-3line .view-bar-bg-group {
        order: 2;
        margin-left: auto;
      }
      .layout-3line .view-bar-linebreak-a {
        order: 3;
        flex-basis: 100%;
      }
      .layout-3line .size-mode-group.view-bar-group {
        order: 4;
      }
      .layout-3line .view-bar-zoom-group {
        order: 5;
      }
      .layout-3line .view-bar-linebreak-b {
        order: 6;
        flex-basis: 100%;
      }
      .layout-3line .view-bar-zoom-auto-group {
        order: 7;
      }
      /* :not(.color-swatch) so this generic toolbar-button background doesn't win (by ID
         specificity) over a swatch's own background — e.g. the checkerboard pattern on
         .transparent-swatch, which would otherwise render as a solid color instead. */
      #variant-view-bar button:not(.color-swatch) {
        padding: 5px 10px;
        background: #3a3a3a;
        color: #eee;
        border: 1px solid #555;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
        white-space: nowrap;
      }
      #variant-view-bar .zoom-group {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
      }
      #variant-view-bar .zoom-group input[type="range"] {
        width: 120px;
      }
      #variant-view-bar .zoom-group .zoom-number {
        width: 3.4em;
        background: #3a3a3a;
        border: 1px solid #555;
        border-radius: 3px;
        color: #eee;
        font-size: 12px;
        padding: 3px 4px;
      }
      #variant-view-bar .size-mode-group {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 12px;
      }
      #variant-view-bar .size-mode-group label {
        margin-right: 6px;
        cursor: pointer;
      }
      #variant-view-bar .size-mode-group button {
        margin-left: 4px;
      }

      /* ---- Top toolbar (undo/redo, tools, pen size, colors) ---- */
      #top-toolbar {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 4px 8px;
        background: #222;
        border-bottom: 1px solid #444;
        flex-wrap: wrap;
      }
      /* 常時表示の項目(undo/redo・各ツール・配色)はtoolbar-primary-groupに、選んだツールに
         よって出たり消えたりする項目(ブラシサイズ・グラデーションのペア選択)は
         toolbar-conditional-groupにまとめる。幅が足りない時はconditional-group全体だけを
         2行目へ折り返す(updateToolbarLayout)。 */
      .toolbar-group {
        display: flex;
        align-items: center;
        gap: 4px;
        flex-shrink: 0;
        /* nowrap必須: wrapだと内部要素が先に複数行化してしまい、scrollWidthが不正確になる
           (variant-view-barのzoom-controls-groupと同じ理由)。 */
        flex-wrap: nowrap;
      }
      .toolbar-conditional-group.force-new-line {
        flex-basis: 100%;
      }
      .toolbar-divider {
        width: 1px;
        height: 24px;
        background: #444;
        margin: 0 6px;
        flex-shrink: 0;
      }
      .toolbar-icon-btn {
        width: 30px;
        height: 30px;
        flex-shrink: 0;
        background: #3a3a3a;
        color: #eee;
        border: 1px solid #555;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
      }
      .toolbar-icon-btn.active {
        background: #4a7dff;
        border-color: #4a7dff;
      }
      .toolbar-icon-btn:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .pen-size-group {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .pen-size-group input[type="range"] {
        width: 90px;
      }
      .pen-size-display {
        min-width: 3em;
        text-align: center;
        background: #3a3a3a;
        border: 1px solid #555;
        border-radius: 4px;
        color: #eee;
        font-size: 12px;
        padding: 4px 6px;
        cursor: pointer;
      }
      .gradient-pair-select {
        background: #3a3a3a;
        border: 1px solid #555;
        border-radius: 4px;
        color: #eee;
        font-size: 12px;
        padding: 4px 6px;
        cursor: pointer;
      }
      .shape-options-group {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .shape-options-group label {
        display: flex;
        align-items: center;
        gap: 4px;
        color: #eee;
        font-size: 12px;
        white-space: nowrap;
      }
      .shape-options-group select,
      .shape-options-group input[type="number"] {
        background: #3a3a3a;
        border: 1px solid #555;
        border-radius: 4px;
        color: #eee;
        font-size: 12px;
        padding: 4px 6px;
        cursor: pointer;
      }
      .shape-options-group input[type="number"] {
        width: 4em;
        cursor: text;
      }
      .reference-all-layers-label {
        display: flex;
        align-items: center;
        gap: 4px;
        color: #eee;
        font-size: 12px;
        white-space: nowrap;
        cursor: pointer;
      }
      .color-swatch-group {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .color-swatch {
        width: 52px;
        height: 26px;
        border: 1px solid #666;
        border-radius: 4px;
        cursor: pointer;
        padding: 0;
        /* 市松模様(チェッカーボード)を下敷きにしておく。JS側(checkeredBackgroundImage、
           color-utils.ts)がbackground-imageを「色(alpha込み)のレイヤー + この市松2枚」の
           3レイヤーに毎回書き換える — 色レイヤーが先頭(一番上)なので、不透明なら市松を完全に
           覆い隠し、半透明になるほど市松が透けて見える。ここで指定するsize/positionは
           そのJSが書き込む3レイヤー分(色レイヤーは要素全体を覆うのでauto、市松2枚は12px角)に
           対応させておく必要がある。 */
        background-size: auto, 12px 12px, 12px 12px;
        background-position: 0 0, 0 0, 6px 6px;
        background-image:
          linear-gradient(45deg, #777 25%, transparent 25%, transparent 75%, #777 75%),
          linear-gradient(45deg, #777 25%, transparent 25%, transparent 75%, #777 75%);
        background-color: #999;
      }
      .color-swatch.selected {
        box-shadow: 0 0 0 2px #fff, 0 0 0 4px #4a7dff;
      }
      .color-swatch.transparent-swatch {
        /* 市松模様(チェッカーボード) — 正方形が交互に並ぶよう、同じ斜めグラデーションを
           タイルの半分だけずらして重ねる定番の手法。45度グラデーションを使うが、2枚を
           ずらして重ねることで結果は軸に沿った正方形になる(菱形にはならない)。 */
        background-image:
          linear-gradient(45deg, #777 25%, transparent 25%, transparent 75%, #777 75%),
          linear-gradient(45deg, #777 25%, transparent 25%, transparent 75%, #777 75%);
        background-size: 12px 12px;
        background-position: 0 0, 6px 6px;
        background-color: #999;
      }
      .change-color-btn {
        padding: 5px 10px;
        background: #3a3a3a;
        color: #eee;
        border: 1px solid #555;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
      }

      /* ---- Main area: transform panel + canvas + layer panel ---- */
      #main-area {
        flex: 1;
        display: flex;
        overflow: hidden;
        min-height: 0;
      }

      /* ---- Transform panel (left side: 拡大・縮小・回転 / 自由変形) ---- */
      #transform-panel {
        width: 230px;
        flex-shrink: 0;
        box-sizing: border-box;
        background: #222;
        border-right: 1px solid #444;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        padding: 10px;
        gap: 4px;
      }
      #transform-panel.hidden {
        display: none;
      }
      .transform-panel-header {
        font-size: 13px;
        font-weight: bold;
        margin-bottom: 6px;
      }
      .transform-panel-section {
        border-top: 1px solid #3a3a3a;
        padding-top: 8px;
        margin-top: 4px;
      }
      .transform-panel-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 5px 0;
        font-size: 12px;
      }
      .transform-panel-row label {
        flex: 1;
        color: #ccc;
      }
      .transform-panel-row input[type="number"] {
        width: 72px;
        background: #3a3a3a;
        border: 1px solid #555;
        border-radius: 3px;
        color: #eee;
        font-size: 12px;
        padding: 3px 5px;
      }
      .transform-panel-row input[type="checkbox"] {
        margin: 0;
      }
      .transform-panel-hint {
        font-size: 11px;
        color: #888;
        line-height: 1.5;
        margin: 6px 0;
      }
      .transform-panel-buttons {
        display: flex;
        gap: 8px;
        margin-top: 14px;
      }
      .transform-panel-buttons button {
        flex: 1;
        padding: 6px 0;
        background: #3a3a3a;
        color: #eee;
        border: 1px solid #555;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
      }
      .transform-panel-buttons .transform-apply-btn {
        background: #4a7dff;
        border-color: #4a7dff;
      }
      #canvas-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #canvas-viewport {
        flex: 1;
        overflow: auto;
        /* ブラウザ標準の「スクロールアンカリング」(見た目の位置を保つよう自動でスクロール位置を
           補正する機能)が、このビューポート内のスクロール位置を本来の意図と違う形で
           補正してしまうことがあったため無効化する。 */
        overflow-anchor: none;
      }
      .canvas-centerer {
        min-width: 100%;
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .variant-grid {
        /* Dense grid packing: each tile spans cells proportional to its current pixel size (set
           in variant-grid.ts), so a single variant centers, and several variants — including one
           zoomed much bigger than the rest — pack together with the small ones filling the gaps
           left around the big one, instead of leaving dead space like plain flex-wrap would. */
        display: grid;
        grid-auto-flow: dense;
        /* grid-auto-columns alone only creates ONE implicit column (auto-placement needs explicit
           tracks to know how many columns fit across the container), so tiles would stack in a
           single vertical line instead of packing across the viewport. repeat(auto-fit, ...)
           creates as many 20px columns as fit the container width, but — unlike auto-fill —
           collapses any that end up with no tile in them to 0px, so justify-content:center
           centers the actual occupied content instead of the full (mostly-empty) track set. */
        grid-template-columns: repeat(auto-fit, 20px);
        grid-auto-rows: 20px;
        gap: 12px;
        padding: 12px;
        /* widthを明示しない(auto)と、ブロック要素は「margin+width=コンテナ幅」になるよう
           widthの方を自動で縮めてしまうため、variant-grid.tsのscrollTileToCenter()が中央寄せの
           スクロール余地を作るために付けるmargin-left/rightがグリッド自体を縮めるだけで
           スクロール可能領域を全く広げてくれなかった。widthを固定(100%)しておくことで、
           margin分だけ純粋にオーバーフロー(スクロール可能領域)が増えるようになる。 */
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        /* safeを付けないと、グリッド全体の内容がビューポートより大きくなった時
           (単体フィッティングで1枚を巨大化した時など)、中央寄せしようとして内容の一部を
           マイナス座標(scrollLeft/scrollTopは0未満にできないため、スクロールでは絶対に
           届かない範囲)へ追い出してしまい、そのタイルを画面中央にスクロールしようとしても
           届かずズレる不具合になっていた。safe centerは、中央寄せすると内容が見えなくなる
           (オーバーフローする)場合は普通のstart基準に自動で切り替えてくれる — 収まる時は
           これまでと同じく中央寄せ、収まらない時だけスクロールで全部に届く配置になる。 */
        justify-content: safe center;
        align-content: safe center;
      }
      .variant-tile {
        border: 2px solid transparent;
        border-radius: 4px;
        background: #1a1a1a;
        padding: 4px;
        display: flex;
        flex-direction: column;
        /* Grid items stretch to fill their whole allotted cell by default. The cell is
           deliberately sized a little generous (never smaller than the canvas, to avoid
           overflow — see spanForPx() in variant-grid.ts), so without this the tile box would
           visibly balloon past its own canvas, leaving dead space on its right/bottom. Shrinking
           the tile to its own content lets any leftover cell space go unused instead of stretching
           the frame. */
        justify-self: start;
        align-self: start;
      }
      .variant-tile.active {
        border-color: #4a7dff;
      }
      .variant-tile.dragging {
        opacity: 0.5;
      }
      .variant-tile.drag-over {
        border-left: 3px solid #4a7dff;
      }
      .variant-tile.drag-over-after {
        border-right: 3px solid #4a7dff;
      }
      .variant-tile:not(.active) .doc-canvas {
        opacity: 0.85;
        pointer-events: none;
      }
      .variant-tile-header {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        margin-bottom: 4px;
        /* ヘッダーをドラッグしてバリエーションの並び替えができることを示す(variant-grid.ts)。 */
        cursor: grab;
        /* Without this, a narrow tile (small canvas / low zoom) wraps the "書き出し" button's
           label onto two lines, silently inflating the header's — and therefore the tile's —
           real height far past what updateTileSpan() in variant-grid.ts estimated. */
        white-space: nowrap;
      }
      .variant-tile-header span {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .variant-tile-header button {
        background: #3a3a3a;
        color: #eee;
        border: 1px solid #555;
        border-radius: 3px;
        cursor: pointer;
        font-size: 10px;
        padding: 2px 6px;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .variant-tile-header .variant-zoom-lock {
        flex-shrink: 0;
        margin: 0;
        cursor: pointer;
      }
      .variant-canvas-host {
        /* Sized by CanvasWidget to exactly match the current zoom (see resizeVisible) so the
           tile's frame grows/shrinks with it instead of clipping/scrolling a fixed box. */
        flex-shrink: 0;
      }
      .doc-canvas {
        image-rendering: pixelated;
        background:
          linear-gradient(45deg, #777 25%, transparent 25%) 0 0 / 16px 16px,
          linear-gradient(-45deg, #777 25%, transparent 25%) 0 0 / 16px 16px,
          linear-gradient(45deg, transparent 75%, #777 75%) 0 0 / 16px 16px,
          linear-gradient(-45deg, transparent 75%, #777 75%) 0 0 / 16px 16px,
          #999;
        background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
        touch-action: none;
        border: 1px solid #555;
      }

      /* ---- Layer panel ---- */
      #layer-panel {
        width: 260px;
        flex-shrink: 0;
        box-sizing: border-box;
        background: #222;
        border-left: 1px solid #444;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #layer-panel-content {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        flex: 1;
        min-height: 0;
      }
      .layer-panel-handle {
        display: none;
      }

      /* ---- 縦長レイアウト(スマホの縦持ち等) ----
         #main-areaは変形パネルのみ下段固定で縦積みにする。レイヤーパネルは普段は画面下端に
         つまみだけ見える状態で隠れている「ボトムシート」で、つまみを上にドラッグすると
         スライドアップして開く(見出しをタップするだけでも開閉トグル)。 */
      body.portrait-layout #main-area {
        flex-direction: column;
        /* レイヤーパネルの「つまみ」(.layer-panel-handle)は閉じている間も画面下端に常に
           position:fixedで重なって見えている。#main-area自体はそのことを知らず画面最下部まで
           広がるため、何も対策しないとキャンバス表示領域の一番下(スクロールし切った位置)が
           つまみの下に隠れて見えなくなっていた。#main-areaの下にちょうどつまみの高さ分だけ
           余白を作ることで、キャンバス側(getBoundingClientRect/clientHeightを使う
           フィット・中央寄せ・スクロール範囲の計算全て)がその分だけ「使える領域が狭い」と
           正しく認識するようになり、スクロールし切った位置がつまみのすぐ上でちょうど止まる。 */
        margin-bottom: var(--layer-drawer-handle-h);
      }
      body.portrait-layout #canvas-container {
        order: 1;
        min-height: 0;
      }
      body.portrait-layout #transform-panel {
        order: 2;
        width: 100%;
        height: 42vh;
        max-height: 320px;
        border-right: none;
        border-top: 1px solid #444;
      }
      body.portrait-layout #layer-panel {
        position: fixed;
        left: 0;
        right: 0;
        width: 100%;
        /* 元の下段固定(180px)の2倍。 */
        height: 360px;
        border-left: none;
        border-top: 1px solid #444;
        z-index: 50;
        box-shadow: 0 -4px 14px rgba(0, 0, 0, 0.5);
        /* transformではなくbottomで開閉位置を制御する — position:fixed要素のtransformが
           一部環境でcomputed styleに反映されない現象が確認されたため、通常のレイアウト
           プロパティ(bottom)で代用する。実際のbottom値(閉:負の値/開:0)はJS側で設定する。 */
        bottom: 0;
        transition: bottom 0.25s ease;
        touch-action: none;
      }
      body.portrait-layout #layer-panel.drawer-dragging {
        transition: none;
      }
      body.portrait-layout .layer-panel-handle {
        display: flex;
        align-items: center;
        justify-content: center;
        height: var(--layer-drawer-handle-h);
        flex-shrink: 0;
        cursor: grab;
        background: #2a2a2a;
        border-bottom: 1px solid #444;
      }
      body.portrait-layout .layer-panel-handle::before {
        content: "";
        width: 44px;
        height: 4px;
        border-radius: 2px;
        background: #777;
      }
      .layer-panel-header {
        padding: 8px 10px 4px;
        font-size: 13px;
        font-weight: bold;
      }
      .layer-panel-toolbar {
        display: flex;
        gap: 6px;
        padding: 4px 8px 8px;
        border-bottom: 1px solid #444;
      }
      .layer-panel-toolbar button {

        height: 28px;
        background: #3a3a3a;
        color: #eee;
        border: 1px solid #555;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
      }
      .layer-panel-toolbar .spacer {
        flex: 1;
      }
      .layer-panel-toolbar button.active {
        background: #4a7dff;
        border-color: #4a7dff;
      }
      .layer-panel-toolbar button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .layer-panel-opacity {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-bottom: 1px solid #444;
        font-size: 12px;
      }
      .layer-panel-opacity input[type="range"] {
        flex: 1;
      }
      .layer-panel-opacity .value {
        width: 3.2em;
        text-align: right;
        background: #3a3a3a;
        border: 1px solid #555;
        border-radius: 3px;
        color: #eee;
        font-size: 12px;
        padding: 2px 4px;
        flex-shrink: 0;
      }
      .layer-panel-blend-mode {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-bottom: 1px solid #444;
        font-size: 12px;
      }
      .layer-panel-blend-mode select {
        flex: 1;
        min-width: 0;
      }
      .layer-panel-list {
        overflow-y: auto;
        flex: 1;
      }
      .layer-row {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 4px 6px;
        border-bottom: 1px solid #333;
        font-size: 12px;
      }
      .layer-row.active {
        background: #2d4a8a;
      }
      .layer-row.dragging {
        opacity: 0.5;
      }
      .layer-row.drag-over {
        border-top: 2px solid #4a7dff;
      }
      .layer-row.drag-over-after {
        border-bottom: 2px solid #4a7dff;
      }
      .layer-row.drag-over-inside {
        background: #3a5aa0;
      }
      .layer-name {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        cursor: pointer;
      }
      .layer-row-icon {
        display: inline-flex;
        flex-shrink: 0;
      }
      .folder-toggle-btn,
      .folder-toggle-spacer {
        flex-shrink: 0;
        width: 14px;
        height: 14px;
      }
      .folder-toggle-btn {
        background: transparent;
        border: none;
        color: #ccc;
        cursor: pointer;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .folder-toggle-btn svg {
        width: 10px;
        height: 10px;
      }
      .clip-indicator {
        display: inline-flex;
        flex-shrink: 0;
        opacity: 0.8;
      }
      .mask-indicator {
        flex-shrink: 0;
      }
      .mask-indicator.active {
        box-shadow: 0 0 0 2px #4a7dff;
      }
      .layer-controls {
        display: flex;
        gap: 2px;
      }
      .icon-btn {
        background: #3a3a3a;
        color: #eee;
        border: 1px solid #555;
        border-radius: 3px;
        cursor: pointer;
        font-size: 11px;
        width: 20px;
        height: 20px;
        line-height: 1;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .layer-panel-toolbar button svg {
        width: 22px;
        height: 22px;
      }
      .icon-btn svg {
        width: 16px;
        height: 16px;
      }
      .layer-row-icon svg {
        width: 15px;
        height: 15px;
      }

      /* ---- Shared color wheel + palette (used inside the color dialog) ----
         3 columns: big wheel on the left, current color/opacity/HSV/RGB sliders stacked in
         the middle, and a dense editable swatch palette on the right. */
      .color-panel {
        display: flex;
        align-items: flex-start;
        gap: 16px;
      }
      .color-wheel {
        touch-action: none;
        cursor: crosshair;
        flex-shrink: 0;
      }
      .color-info-column {
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 210px;
        flex-shrink: 0;
      }
      .current-swatch {
        width: 100%;
        height: 28px;
        /* 暗い色だと縁が背景に溶けて見えなくなるため、常にはっきり見える白枠にする。 */
        border: 1px solid #fff;
        border-radius: 3px;
        /* チェッカーボードを下敷きにする(.color-swatchと同じ理由・同じ3レイヤー方式 —
           checkeredBackgroundImage()がJS側でbackground-imageを上書きする)。 */
        background-size: auto, 12px 12px, 12px 12px;
        background-position: 0 0, 0 0, 6px 6px;
        background-image:
          linear-gradient(45deg, #777 25%, transparent 25%, transparent 75%, #777 75%),
          linear-gradient(45deg, #777 25%, transparent 25%, transparent 75%, #777 75%);
        background-color: #999;
      }
      .value-row {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
      }
      .value-row-label {
        width: 4.4em;
        flex-shrink: 0;
        white-space: nowrap;
        color: #ccc;
      }
      .value-row input[type="range"] {
        flex: 1;
        min-width: 0;
      }
      .value-row-number {
        /* widthは下の.color-panel input.value-row-numberで指定する。.modal-box
           input[type="number"]のルール(詳細度(0,2,1))に、単純な.value-row-number単体
           (詳細度(0,1,0))だと負けて110pxに上書きされてしまうため、同等以上の詳細度の
           セレクタをそちら側(後方)で定義する必要がある。 */
        flex-shrink: 0;
        background: #3a3a3a;
        border: 1px solid #555;
        border-radius: 3px;
        color: #eee;
        font-size: 11px;
        padding: 2px 3px;
      }
      /* ---- カラーダイアログのタブ(HSVRGBA/パレット/一時パレット) ----
         PC(横長)ではタブ自体を隠し、.color-tab-panelを常に全部表示する(=現状の3列並びの
         ままで見た目は変わらない)。スマホ幅のメディアクエリでのみタブバーを表示し、
         .activeが付いた1枚だけを見せる(詳しくは下のメディアクエリ参照)。 */
      .color-tab-bar {
        display: none;
      }
      .color-tab-btn {
        flex: 1;
        padding: 6px 4px;
        background: #3a3a3a;
        border: 1px solid #555;
        border-radius: 4px;
        color: #ccc;
        font-size: 12px;
        cursor: pointer;
      }
      .color-tab-btn.active {
        background: #4a7dff;
        border-color: #4a7dff;
        color: #fff;
      }
      .color-tab-panel {
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 100%;
      }
      .palette-column {
        display: flex;
        flex-direction: column;
        gap: 4px;
        width: 150px;
        flex-shrink: 0;
      }
      .palette-section-label {
        font-size: 12px;
        font-weight: bold;

        width: 100%;
        margin: 2px 0 4px;

        display: grid;
        grid-template-columns: repeat(7, 18px);
        grid-auto-rows: 18px;
        gap: 3px;
        align-content: flex-start;
        max-height: 140px;
        overflow-y: auto;

      .palette-swatch {
        width: 18px;

      /* ---- Brush size preset popup ---- */
      .size-popup-grid {

        z-index: 300;
      }
      .modal-overlay.visible {
        display: flex;
      }
      .modal-box {
        background: #2a2a2a;
        border: 1px solid #555;
        border-radius: 6px;
        padding: 16px 20px;
        width: 320px;
        max-height: 90vh;
        overflow-y: auto;
      }
      .modal-box.color-dialog-box {
        width: auto;
      }
      .modal-box h2 {
        margin: 0 0 12px;
        font-size: 16px;
      }
      .modal-box fieldset {
        border: 1px solid #444;
        border-radius: 4px;
        margin-bottom: 10px;
      }
      .modal-box legend {
        font-size: 11px;
        color: #aaa;
        padding: 0 4px;
      }
      .modal-box label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 13px;
        margin: 6px 0;
      }
      .modal-box input[type="number"],
      .modal-box input[type="text"] {
        width: 110px;
      }
      /* 上のルール(詳細度(0,2,1))に合わせて同等以上の詳細度にし、カラーピッカーの数値欄だけ
         幅を独自に指定する(セレクタ単純化のための後方上書き)。 */
      .color-panel input.value-row-number {
        width: 3.4em;
      }
      .modal-box .direct-fields.disabled,
      .modal-box .scale-fields.disabled,
      .modal-box .custom-size-fields.disabled {
        opacity: 0.4;
        pointer-events: none;
      }
      .modal-box .scale-result {
        font-size: 12px;
        text-align: right;
        margin: 4px 0 0;
        color: #9c9;
      }
      .modal-buttons {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 12px;
      }
      .modal-buttons button {
        padding: 6px 14px;
        background: #3a3a3a;
        color: #eee;
        border: 1px solid #555;
        border-radius: 4px;
        cursor: pointer;
      }
      .modal-buttons .create-btn {
        background: #4a7dff;
        border-color: #4a7dff;
      }

      /* ---- スマホ幅向けコンパクト化 ----
         上記の各要素は全てPC想定のサイズなので、幅の狭い画面では1行に収まらず折り返しや
         横溢れ(scrollWidth > clientWidth)が起きる。ボタン類のpadding/font-size/gapや
         スライダー幅を縮めて、同じ行数でも占有幅を減らす(レイアウト構造自体は変えない)。 */
      @media (max-width: 480px) {
        #menu-bar button {
          padding: 5px 8px;
          font-size: 12px;
        }
        #variant-view-bar {
          gap: 4px;
          padding: 3px 4px;
        }
        .view-bar-group {
          gap: 4px;
        }
        #variant-view-bar button:not(.color-swatch) {
          padding: 4px 6px;
          font-size: 11px;
        }
        #variant-view-bar .zoom-group {
          gap: 2px;
          font-size: 11px;
        }
        #variant-view-bar .zoom-group input[type="range"] {
          width: 48px;
        }
        #variant-view-bar .zoom-group .zoom-number {
          font-size: 11px;
          padding: 2px 3px;
        }
        /* ミニラフ/完成サイズの切替は横幅を特に食うため(ラジオ2個+ラベル2個+ボタン)、
           倍率グループ(zoom-group)と同じ行に収まるようここだけさらに切り詰める。 */
        #variant-view-bar .size-mode-group {
          gap: 1px;
          font-size: 10px;
        }
        #variant-view-bar .size-mode-group label {
          margin-right: 1px;
        }
        #variant-view-bar .size-mode-group input[type="radio"] {
          width: 12px;
          height: 12px;
          margin: 0;
        }
        #variant-view-bar .size-mode-group button {
          margin-left: 1px;
          padding: 3px 4px;
          font-size: 10px;
        }
        #top-toolbar {
          gap: 2px;
          padding: 3px 4px;
        }
        .toolbar-group {
          gap: 2px;
        }
        .toolbar-divider {
          height: 20px;
          margin: 0 3px;
        }
        .toolbar-icon-btn {
          width: 26px;
          height: 26px;
          font-size: 13px;
        }
        /* Undo/Redoはツールバー内で押す頻度が高いので他のアイコンよりは大きくするが、
           表示バードロワーが独立したハンドルバーに移って空いた分は通常のツールアイコンを
           大きくする方へ回したため、以前より一回り控えめなサイズにしている。 */
        .toolbar-undo-redo-btn {
          width: 40px;
          height: 40px;
          font-size: 18px;
        }
        /* ハンバーガー(メニュー)ボタンは押し間違え防止のため通常のツールアイコンの
           1.5倍以上のサイズにする。 */
        .mobile-nav-toggle-btn {
          width: 40px;
          height: 40px;
          font-size: 20px;
        }
        .pen-size-group {
          gap: 3px;
        }
        .pen-size-group input[type="range"] {
          width: 56px;
        }
        .pen-size-display {
          min-width: 2.6em;
          font-size: 11px;
          padding: 3px 4px;
        }
        .gradient-pair-select {
          font-size: 11px;
          padding: 3px 4px;
        }
        .color-swatch-group {
          gap: 3px;
        }
        .color-swatch {
          width: 38px;
          height: 22px;
        }
        .change-color-btn {
          padding: 4px 6px;
          font-size: 11px;
        }
        .layer-panel-toolbar {
          gap: 3px;
          padding: 3px 4px 6px;
        }
        .layer-panel-toolbar button {
          width: 24px;
          height: 24px;
        }
        .layer-panel-toolbar button svg {
          width: 18px;
          height: 18px;
        }
        .icon-btn {
          width: 18px;
          height: 18px;
        }
        .icon-btn svg {
          width: 13px;
          height: 13px;
        }
        .layer-row {
          gap: 2px;
          padding: 3px 4px;
          font-size: 11px;
        }
        .layer-panel-opacity,
        .layer-panel-blend-mode {
          padding: 4px 6px;
          font-size: 11px;
        }
        /* help-dialog-box(幅560px)等、PC想定の固定幅モーダルが画面からはみ出さないようにする
           安全策。各モーダル個別のwidth指定自体は変えない(max-widthで上から制限するだけ)。 */
        .modal-box {
          max-width: 92vw;
        }
        /* 設定ダイアログ: 狭い画面ではサイドメニューを左に縦積みする余白が無いため、
           色変更ダイアログのタブと同じ考え方で上部に横並びのタブとして出す。 */
        .settings-layout {
          flex-direction: column;
        }
        .settings-sidebar {
          flex-direction: row;
          width: 100%;
        }
        .settings-nav-btn {
          flex: 1;
          text-align: center;
        }
        /* 色変更ダイアログ(.color-panel) — PC想定では「ホイール+情報列+パレット列」を横に
           3列並べる(合計600px超)ため、スマホ幅では画面に収まらず横溢れしていた。
           縦に積み直し、ダイアログ自体も画面幅まで広げる(.modal-box.color-dialog-box参照)。 */
        .color-panel {
          flex-direction: column;
          align-items: center;
          gap: 10px;
        }
        .color-wheel {
          width: 200px;
          height: 200px;
        }
        /* HSVRGBA/パレット/一時パレットを縦に全部並べるとダイアログが縦に長くなりスクロールが
           発生するため、現在の色の下にタブを置いて1枚だけ見せる。 */
        .color-tab-bar {
          display: flex;
          width: 100%;
          gap: 6px;
          margin: 4px 0 2px;
        }
        .color-tab-panel:not(.active) {
          display: none;
        }
        .color-info-column,
        .palette-column {
          width: 100%;
          max-width: none;
          align-items: center;
        }
        /* パレットはダイアログの横幅をちゃんと使い、1色あたりも一回り大きくする
           (PC用の18px/7列固定だと画面の大部分が余ってしまっていた)。 */
        .palette-swatch {
          width: 30px;
          height: 30px;
        }
        .palette-grid {
          grid-template-columns: repeat(auto-fill, 30px);
          grid-auto-rows: 30px;
          gap: 5px;
          max-height: 220px;
          justify-content: center;
        }
        /* .color-dialog-box自体のwidth:auto(PC用、3列分の幅に合わせて伸縮)のままだと、
           縦積み後の子要素(width:100%)の基準が定まらない循環になるため、画面幅基準の
           はっきりした値に切り替える(.modal-boxのmax-width:92vwは別ルールでそのまま効く)。 */
        .modal-box.color-dialog-box {
          width: 100%;
        }
      }

      /* ---- さらに狭い画面(iPhone SE等、幅360px以下)向けの追加コンパクト化 ----
         480px用の値でもまだ横溢れが残る幅があったため、ボタン/スライダーをもう一段縮める。 */
      @media (max-width: 360px) {
        #menu-bar button {
          padding: 4px 6px;
          font-size: 11px;
        }
        #variant-view-bar {
          gap: 3px;
          padding: 2px 3px;
        }
        .view-bar-group {
          gap: 3px;
        }
        #variant-view-bar button:not(.color-swatch) {
          padding: 3px 5px;
          font-size: 10px;
        }
        #variant-view-bar .zoom-group input[type="range"] {
          width: 40px;
        }
        #variant-view-bar .size-mode-group button {
          padding: 2px 3px;
        }
        #top-toolbar {
          gap: 1px;
          padding: 2px 3px;
        }
        .toolbar-group {
          gap: 1px;
        }
        .toolbar-divider {
          margin: 0 2px;
        }
        .toolbar-icon-btn {
          width: 22px;
          height: 22px;
          font-size: 11px;
        }
        .toolbar-undo-redo-btn {
          width: 36px;
          height: 36px;
          font-size: 16px;
        }
        .mobile-nav-toggle-btn {
          width: 36px;
          height: 36px;
          font-size: 18px;
        }
        .pen-size-group input[type="range"] {
          width: 42px;
        }
        .color-swatch {
          width: 30px;
          height: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="mobile-nav-drawer">
        <div id="menu-bar"></div>
      </div>
      <div id="mobile-nav-backdrop"></div>
      <div id="mobile-viewbar-drawer">
        <div id="variant-view-bar"></div>
      </div>
      <div id="top-toolbar">
        <button id="mobile-nav-toggle" class="toolbar-icon-btn mobile-nav-toggle-btn" title="メニューを開く/閉じる" aria-label="メニューを開く/閉じる">☰</button>
      </div>
      <div id="mobile-viewbar-handle" title="バリエーション・倍率・表示サイズ・背景色を開く/閉じる" aria-label="バリエーション・倍率・表示サイズ・背景色を開く/閉じる">▾</div>
      <div id="main-area">
        <div id="transform-panel" class="hidden"></div>
        <div id="canvas-container">
          <div id="canvas-viewport"></div>
        </div>
        <div id="layer-panel">
          <div id="layer-panel-handle" class="layer-panel-handle"></div>
          <div id="layer-panel-content"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
